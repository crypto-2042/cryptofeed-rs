[workspace]
members = [
  "crates/core",
  "crates/ticker",
  "crates/trade",
  "crates/orderbook",
  "crates/candles",
  "crates/funding",
  "crates/index",
  "crates/liquidations",
  "crates/markprice",
  "crates/openinterest",
  "crates/runtime",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "XFree86-1.1"
version = "0.1.0"
repository = "https://github.com/crypto-2042/cryptofeed-rs"
readme = "README.md"
rust-version = "1.85"
keywords = ["cryptocurrency", "market-data", "websocket", "trading"]
categories = ["api-bindings", "finance"]

[workspace.dependencies]
cryptofeed-core = { path = "crates/core", version = "0.1.0" }
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1.43", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
url = "2"
